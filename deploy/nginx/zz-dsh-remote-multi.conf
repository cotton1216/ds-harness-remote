# 多账号验收实例：与 443 的既有单账号服务完全隔离，仅新增 8443。
# 不改动 default_server，不监听 80，不影响 ACME 与既有站点。
server {
    listen 8443 ssl;
    server_name <RELAY_IP>;

    ssl_certificate     /root/.certbot-ip/config/live/<RELAY_IP>/fullchain.pem;
    ssl_certificate_key /root/.certbot-ip/config/live/<RELAY_IP>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IPSSL:5m;
    ssl_session_timeout 1d;

    client_max_body_size 100m;

    location = /nginx-health {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_relay_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
