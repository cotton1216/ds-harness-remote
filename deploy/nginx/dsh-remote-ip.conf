map $http_upgrade $dsh_relay_upgrade {
    default upgrade;
    ""      close;
}

# IP-addressed HTTPS endpoint for the DSH remote relay.
# default_server is required: clients connecting by bare IP send no SNI.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name <RELAY_IP>;

    ssl_certificate     /root/.certbot-ip/config/live/<RELAY_IP>/fullchain.pem;
    ssl_certificate_key /root/.certbot-ip/config/live/<RELAY_IP>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IPSSL:5m;
    ssl_session_timeout 1d;

    client_max_body_size 100m;

    location = /nginx-health {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_relay_upgrade;
        # control WebSocket must stay open well past the 75s server-side idle limit
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
